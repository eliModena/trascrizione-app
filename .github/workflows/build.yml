name: Build macOS DMG

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller faster-whisper sounddevice numpy pillow

      - name: Convert logo to PNG
        run: |
          python -c "from PIL import Image; img = Image.open('logo.jpg'); img.save('logo.png')" || true

      - name: Build macOS App
        run: |
          pyinstaller --windowed --name "BE Video Intercom Transcriptor" --icon=logo.png --osx-bundle-identifier "com.be.videotranscriptor" app.py

      - name: Inject Microphone Permissions into Info.plist
        run: |
          PLIST_PATH="dist/BE Video Intercom Transcriptor.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'BE Video Intercom Transcriptor richiede l'accesso al microfono per effettuare la trascrizione in tempo reale.'" "$PLIST_PATH" || \
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'BE Video Intercom Transcriptor richiede l'accesso al microfono per effettuare la trascrizione in tempo reale.'" "$PLIST_PATH"

      - name: Create DMG package
        run: |
          mkdir dmg_root
          cp -R "dist/BE Video Intercom Transcriptor.app" dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "BEVideoTranscriptorInstaller" -srcfolder dmg_root -ov -format UDZO BEVideoIntercomTranscriptor.dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BEVideoTranscriptor-DMG
          path: BEVideoIntercomTranscriptor.dmg
