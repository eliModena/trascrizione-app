name: Build Portable Web App

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'

      - name: Make launcher executable
        run: |
          chmod +x run.command

      - name: Create ZIP Package
        run: |
          mkdir -p BE-Video-Intercom-Transcriptor
          cp app.py BE-Video-Intercom-Transcriptor/
          cp run.command BE-Video-Intercom-Transcriptor/
          if [ -f logo.jpg ]; then cp logo.jpg BE-Video-Intercom-Transcriptor/; fi
          if [ -f logo.png ]; then cp logo.png BE-Video-Intercom-Transcriptor/; fi
          
          zip -r BE-Video-Intercom-Transcriptor.zip BE-Video-Intercom-Transcriptor

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BE-Video-Intercom-Transcriptor-Package
          path: BE-Video-Intercom-Transcriptor.zip
