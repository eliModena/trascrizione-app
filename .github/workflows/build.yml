name: Build macOS DMG

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyinstaller faster-whisper sounddevice numpy

      - name: Build macOS App
        run: |
          pyinstaller --windowed --name "TrascrizioneOffline" app.py

      - name: Create DMG package
        run: |
          mkdir dmg_root
          cp -R dist/TrascrizioneOffline.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "TrascrizioneInstaller" -srcfolder dmg_root -ov -format UDZO TrascrizioneOffline.dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrascrizioneOffline-DMG
          path: TrascrizioneOffline.dmg
